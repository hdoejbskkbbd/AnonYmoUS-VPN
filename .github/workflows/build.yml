name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Download and setup Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Verify Gradle
      run: gradle --version

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: anonymous-tunnel-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: anonymous-tunnel-release
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: AnonymousTunnel v${{ github.run_number }}
        body: |
          AnonymousTunnel VPN - Multi-Protocol Tunneling App

          Features:
          - SSH, VLess, VMess, Trojan, Shadowsocks, DNSTT
          - WebSocket, gRPC, TCP transports
          - Kill Switch, Split Tunneling, Auto-Reconnect
          - Stealth Mode, Performance Mode
          - Custom DNS, Payload Injection
          - QR Code Import/Export
          - Subscription Link Support

          Server Message: Anonymous (Colored)
        files: |
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
